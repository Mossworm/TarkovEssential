name: Sync upstream master

on:
  schedule:
    # Run every six hours. Scheduled workflows use UTC by default.
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-upstream-master
  cancel-in-progress: false

jobs:
  sync:
    name: Sync the fork with upstream
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Merge upstream/master into master
        env:
          # A PAT is used so the resulting branch and tag push events can
          # trigger the repository's existing build and release workflows.
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "The SYNC_TOKEN repository secret is required."
            exit 1
          fi

          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/merge-upstream" \
            --field branch=master

      - name: Checkout the synchronized master branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Push new upstream tags to the fork
        shell: bash
        run: |
          git remote add upstream https://github.com/the-hideout/TarkovMonitor.git

          LC_ALL=C git ls-remote --tags --refs upstream \
            | awk '{ sub("refs/tags/", "", $2); print $2 }' \
            | sort > upstream-tags.txt

          LC_ALL=C git ls-remote --tags --refs origin \
            | awk '{ sub("refs/tags/", "", $2); print $2 }' \
            | sort > fork-tags.txt

          comm -23 upstream-tags.txt fork-tags.txt > missing-tags.txt

          if [ ! -s missing-tags.txt ]; then
            echo "No new upstream tags to push."
            exit 0
          fi

          while IFS= read -r tag; do
            echo "Pushing upstream tag: $tag"
            git fetch upstream "refs/tags/$tag:refs/tags/$tag"
            git push origin "refs/tags/$tag:refs/tags/$tag"
          done < missing-tags.txt
